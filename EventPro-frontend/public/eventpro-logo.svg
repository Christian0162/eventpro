<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="EventPro logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.55" stop-color="#EC4899"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDE047"/>
      <stop offset="1" stop-color="#FB923C"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- app tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>

  <!-- confetti -->
  <g>
    <circle cx="96" cy="120" r="12" fill="#FDE047"/>
    <circle cx="430" cy="96" r="9" fill="#67E8F9"/>
    <circle cx="456" cy="300" r="11" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="70" cy="330" r="8" fill="#A7F3D0"/>
    <rect x="392" y="150" width="26" height="10" rx="5" fill="#FFFFFF" transform="rotate(35 405 155)"/>
    <rect x="86" y="214" width="26" height="10" rx="5" fill="#67E8F9" transform="rotate(-30 99 219)"/>
    <rect x="360" y="420" width="24" height="10" rx="5" fill="#FDE047" transform="rotate(20 372 425)"/>
    <path d="M140 70 l10 18 l-20 0 z" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <!-- calendar -->
  <g filter="url(#shadow)">
    <rect x="112" y="150" width="288" height="264" rx="36" fill="#FFFFFF"/>
    <path d="M112 186a36 36 0 0 1 36-36h216a36 36 0 0 1 36 36v34H112z" fill="#312E81"/>
    <rect x="176" y="112" width="30" height="64" rx="15" fill="#FDE047"/>
    <rect x="306" y="112" width="30" height="64" rx="15" fill="#FDE047"/>
    <!-- date dots -->
    <g fill="#C4B5FD">
      <circle cx="170" cy="272" r="14"/><circle cx="226" cy="272" r="14"/><circle cx="282" cy="272" r="14"/>
      <circle cx="170" cy="332" r="14"/><circle cx="226" cy="332" r="14"/>
      <circle cx="170" cy="386" r="0"/>
    </g>
  </g>

  <!-- star -->
  <g filter="url(#shadow)" transform="translate(338 336) rotate(12)">
    <path d="M0 -88 L25 -28 L90 -24 L40 18 L56 82 L0 48 L-56 82 L-40 18 L-90 -24 L-25 -28 Z"
          fill="url(#star)" stroke="#FFFFFF" stroke-width="10" stroke-linejoin="round"/>
  </g>
</svg>
